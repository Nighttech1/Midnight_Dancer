name: KMP iOS unsigned Debug smoke (not TestFlight)

# Produces MidnightDancer-stage4.ipa for Mobile Next Cloud re-sign + install.
# Windows cannot build Kotlin/Native iOS — this job must run on macos-latest.

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: "Target SDK (iphoneos = real/cloud iPhone; iphonesimulator = sim)"
        required: true
        default: iphoneos
        type: choice
        options:
          - iphoneos
          - iphonesimulator

concurrency:
  group: kmp-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Record selected toolchain and revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios-build/diagnostics
          {
            echo "Unsigned Debug compile smoke only; not TestFlight or installability acceptance."
            echo "Using hosted runner default Xcode; compatibility unverified."
            printf 'Revision: '; git rev-parse HEAD
            xcode-select -p
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            java -version
          } 2>&1 | tee ios-build/diagnostics/toolchain.log

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned Debug IPA (not TestFlight)
        env:
          CONFIGURATION: Debug
          SDK: ${{ inputs.sdk }}
        run: |
          set -euo pipefail
          mkdir -p ios-build/diagnostics
          chmod +x scripts/build-kmp-ios-ipa.sh kmp/gradlew
          ./scripts/build-kmp-ios-ipa.sh "$SDK" 2>&1 | tee ios-build/diagnostics/build.log
          {
            printf 'Revision: '; git rev-parse HEAD
            printf 'Configuration: %s; SDK: %s\n' "$CONFIGURATION" "$SDK"
            shasum -a 256 ios-build/artifacts/current/MidnightDancer-stage4.ipa
          } | tee ios-build/diagnostics/artifact.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MidnightDancer-unsigned-Debug-smoke-${{ inputs.sdk }}
          path: ios-build/artifacts/current/MidnightDancer-stage4.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Shared.framework (debug aid)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-framework-debug
          path: |
            kmp/shared/build/bin/iosArm64/debugFramework
            kmp/shared/build/bin/iosSimulatorArm64/debugFramework
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-diagnostics
          path: ios-build/diagnostics/**
          if-no-files-found: ignore
          retention-days: 14
