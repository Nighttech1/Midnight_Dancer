name: KMP Android Stage 1

on:
  push:
    paths:
      - "kmp/**"
      - ".github/workflows/kmp-android.yml"
  pull_request:
    paths:
      - "kmp/**"

jobs:
  android-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug + unit tests
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleDebug :core:domain:testDebugUnitTest :core:navigation:testDebugUnitTest --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kmp-androidApp-debug
          path: kmp/androidApp/build/outputs/apk/debug/*.apk
