  # ─── KMP (новый путь) — kmp/iosApp → ios-build/artifacts/current/ ───
  # Вариант A (сейчас): UNSIGNED IPA для Mobile Next / cloud re-sign.
  #   Без ios_signing / App Store Connect — иначе «No matching certificate…».
  # Вариант B (релиз позже): вернуть ios_signing + app_store_connect + use-profiles
  #   — см. ios-build/kmp/CODEMAGIC.md и tasks/ПЛАН_миграции_на_KMP.md (Stage 5 checklist).
  # Документация: ios-build/kmp/CODEMAGIC.md · карта: ios-build/README.md
  ios-ipa-kmp:
    name: KMP iOS unsigned Debug smoke (not TestFlight)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      java: 17
      vars:
        IPA_NAME: MidnightDancer-stage4.ipa
        CONFIGURATION: Debug
    scripts:
      - name: Record smoke-build toolchain and revision
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          mkdir -p ios-build/diagnostics
          {
            echo "Unsigned Debug compile smoke only; not TestFlight or installability acceptance."
            echo "Xcode selection: latest (compatibility unverified; record actual version below)."
            printf 'Revision: '; git rev-parse HEAD
            printf 'Configuration: %s\n' "$CONFIGURATION"
            xcode-select -p
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            java -version
          } 2>&1 | tee ios-build/diagnostics/toolchain.log
      - name: Build unsigned Debug IPA (not TestFlight)
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          mkdir -p ios-build/diagnostics
          chmod +x scripts/build-kmp-ios-ipa.sh kmp/gradlew
          ./scripts/build-kmp-ios-ipa.sh iphoneos 2>&1 | tee ios-build/diagnostics/build.log
          test -f "ios-build/artifacts/current/${IPA_NAME}"
          {
            printf 'Revision: '; git rev-parse HEAD
            printf 'Configuration: %s\n' "$CONFIGURATION"
            echo "SDK target: iphoneos; unsigned smoke artifact, not TestFlight."
            shasum -a 256 "ios-build/artifacts/current/${IPA_NAME}"
          } | tee ios-build/diagnostics/artifact.txt
    artifacts:
      - ios-build/artifacts/current/*.ipa
      - ios-build/diagnostics/**

  ios-kmp-internal-testflight:
    name: KMP iOS signed internal TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Midnight Dancer
    environment:
      xcode: latest
      java: 17
      ios_signing:
        provisioning_profiles:
          - midnight_dancer_app_store_2026
        certificates:
          - "Midnight Dancer - Apple Distribution 2026"
      vars:
        APP_STORE_APPLE_ID: "6762514145"
        IOS_MARKETING_VERSION: "1.0.4"
    scripts:
      - name: Prepare Release framework and Xcode project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          chmod +x scripts/build-kmp-ios-ipa.sh kmp/gradlew
          git rev-parse HEAD
          xcodebuild -version
          CONFIGURATION=Release PREPARE_ONLY=1 ./scripts/build-kmp-ios-ipa.sh iphoneos
      - name: Apply signing and archive for internal testing
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/kmp/iosApp"
          latest=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" --platform IOS --all-versions)
          [[ "$latest" =~ ^[0-9]+$ ]] || { echo 'Could not read latest Apple build number'; exit 1; }
          if (( latest < 20 )); then latest=20; fi
          build_number=$((latest + 1))
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $IOS_MARKETING_VERSION" iosApp/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build_number" iosApp/Info.plist
          xcode-project use-profiles --project MidnightDancerIos.xcodeproj
          xcode-project build-ipa --project MidnightDancerIos.xcodeproj --scheme iosApp
    artifacts:
      - kmp/iosApp/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  # ─── KMP Android manual QA плеера хорео (матрикс D + E) ───
  # D (правки/целостность) — unit-тесты, без устройства, быстрый гейт.
  # E (проигрывание через стыки) — connected-тест на эмуляторе CI (счётчики декодера).
  # Manual-only onboarding: no push/PR triggers; start this workflow explicitly in Codemagic.
  kmp-android-tests:
    name: Midnight Dancer KMP Android tests (D + E)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Группа D — unit-тесты логики (без устройства, гейт)
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          chmod +x kmp/gradlew
          cd kmp
          mkdir -p "$CM_BUILD_DIR/ci-diagnostics"
          set -o pipefail
          ./gradlew :feature:choreography:logic:testDebugUnitTest --console=plain 2>&1 | tee "$CM_BUILD_DIR/ci-diagnostics/android-unit.log"
      - name: Группа E — поднять эмулятор + connected-тест плеера
        script: |
          set -eo pipefail
          mkdir -p "$CM_BUILD_DIR/ci-diagnostics"
          cd "$CM_BUILD_DIR"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "emulator" "system-images;android-33;google_apis;x86_64" >/dev/null
          echo "no" | avdmanager --verbose create avd --force -n test -k "system-images;android-33;google_apis;x86_64" -d pixel
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" -avd test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot &
          adb wait-for-device
          boot=""; n=0
          until [ "$boot" = "1" ] || [ "$n" -ge 60 ]; do sleep 5; boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); n=$((n+1)); done
          adb shell input keyevent 82 || true
          cd kmp
          ./gradlew :androidApp:connectedDebugAndroidTest \
            "-Pandroid.testInstrumentationRunnerArguments.class=com.midnightdancer.app.ChoreoPlaybackSmokeTest" \
            --console=plain 2>&1 | tee "$CM_BUILD_DIR/ci-diagnostics/android-connected.log"
    artifacts:
      - ci-diagnostics/**
      - kmp/feature/choreography/logic/build/reports/tests/**
      - kmp/feature/choreography/logic/build/test-results/**
      - kmp/androidApp/build/reports/androidTests/**
      - kmp/androidApp/build/outputs/**/androidTest-results/**
