# Midnight Dancer iOS — XcodeGen project (C-07 / C-09 / C-23 / C-29 Stage 4 shells)
# scripts/build-kmp-ios-ipa.sh links :shared:linkDebugFrameworkIosArm64 and syncs
# Shared.framework into shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/
# (also searchable under shared/build/bin/iosArm64/debugFramework).
# Sources under iosApp/ include Bridge/ (Shared import) + Features/ (+ Components/, pure SwiftUI).

name: MidnightDancerIos
options:
  bundleIdPrefix: com.midnightdancer
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  ENABLE_BITCODE: "NO"
packages:
  CryptoSwift:
    url: https://github.com/krzyzanowskim/CryptoSwift.git
    exactVersion: 1.10.0
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - "**/*.md"
      - path: ../androidApp/src/main/res/font/noto_serif_regular.ttf
        buildPhase: resources
      - path: ../androidApp/src/main/res/font/noto_serif_bold.ttf
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.midnightdancer.app
      PRODUCT_NAME: MidnightDancer
      INFOPLIST_FILE: iosApp/Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Staged static Shared.framework + Gradle bin paths (device + simulator)
      FRAMEWORK_SEARCH_PATHS:
        - "$(inherited)"
        - "$(SRCROOT)/Frameworks"
        - "$(SRCROOT)/../shared/build/bin/iosArm64/debugFramework"
        - "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
        - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
        - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/releaseFramework"
        - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
      OTHER_LDFLAGS: "$(inherited) -framework Shared"
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
      VALIDATE_PRODUCT: "NO"
    # Static KMP framework (isStatic=true): link only — do not embed.
    dependencies:
      - package: CryptoSwift
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Midnight Dancer
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - noto_serif_regular.ttf
          - noto_serif_bold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.midnightdancer.app.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: iosApp
      TARGETED_DEVICE_FAMILY: "1"
  iosAppCryptoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iosAppCryptoTests
    dependencies:
      - target: iosApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.midnightdancer.app.cryptotests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MidnightDancer.app/MidnightDancer"
      BUNDLE_LOADER: "$(TEST_HOST)"
      TARGETED_DEVICE_FAMILY: "1"
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iosAppUITests
        - iosAppCryptoTests
    archive:
      config: Release
